<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Sigmoid activation function</title>
  <desc id="desc">The sigmoid curve maps input values into the range from zero to one.</desc>
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f1f1f">sigmoid(x)</text>
  <text x="380" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555555">把任意输入压缩到 0 到 1 之间，常用于概率直觉</text>
  <g transform="translate(70 86)">
    <rect width="620" height="250" fill="#fbfbfb" stroke="#d9d9d9"/>
    <g stroke="#eeeeee" stroke-width="1">
      <line x1="0" y1="250" x2="620" y2="250"/>
      <line x1="0" y1="187.5" x2="620" y2="187.5"/>
      <line x1="0" y1="125" x2="620" y2="125"/>
      <line x1="0" y1="62.5" x2="620" y2="62.5"/>
      <line x1="0" y1="0" x2="620" y2="0"/>
      <line x1="103.3" y1="0" x2="103.3" y2="250"/>
      <line x1="206.7" y1="0" x2="206.7" y2="250"/>
      <line x1="310" y1="0" x2="310" y2="250"/>
      <line x1="413.3" y1="0" x2="413.3" y2="250"/>
      <line x1="516.7" y1="0" x2="516.7" y2="250"/>
    </g>
    <g stroke="#808080" stroke-width="1.4">
      <line x1="0" y1="250" x2="620" y2="250"/>
      <line x1="310" y1="0" x2="310" y2="250"/>
    </g>
    <path d="M 0 249.4 C 88 248.6 138 242 188 224 C 238 206 263 166 310 125 C 357 84 382 44 432 26 C 482 8 532 1.4 620 0.6" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <g font-family="Arial, sans-serif" font-size="12" fill="#555555">
      <text x="0" y="274" text-anchor="middle">-6</text>
      <text x="103.3" y="274" text-anchor="middle">-4</text>
      <text x="206.7" y="274" text-anchor="middle">-2</text>
      <text x="310" y="274" text-anchor="middle">0</text>
      <text x="413.3" y="274" text-anchor="middle">2</text>
      <text x="516.7" y="274" text-anchor="middle">4</text>
      <text x="620" y="274" text-anchor="middle">6</text>
      <text x="-12" y="254" text-anchor="end">0</text>
      <text x="-12" y="129" text-anchor="end">0.5</text>
      <text x="-12" y="4" text-anchor="end">1</text>
      <text x="620" y="228" text-anchor="end" fill="#2563eb" font-weight="700">S-shaped compression</text>
    </g>
  </g>
</svg>
