<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">GELU activation function</title>
  <desc id="desc">The GELU curve is similar to ReLU but transitions more smoothly around zero.</desc>
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f1f1f">GELU(x)</text>
  <text x="380" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555555">形状接近 ReLU，但在 0 附近更平滑，常见于 Transformer</text>
  <g transform="translate(70 86)">
    <rect width="620" height="250" fill="#fbfbfb" stroke="#d9d9d9"/>
    <g stroke="#eeeeee" stroke-width="1">
      <line x1="0" y1="250" x2="620" y2="250"/>
      <line x1="0" y1="187.5" x2="620" y2="187.5"/>
      <line x1="0" y1="125" x2="620" y2="125"/>
      <line x1="0" y1="62.5" x2="620" y2="62.5"/>
      <line x1="0" y1="0" x2="620" y2="0"/>
      <line x1="103.3" y1="0" x2="103.3" y2="250"/>
      <line x1="206.7" y1="0" x2="206.7" y2="250"/>
      <line x1="310" y1="0" x2="310" y2="250"/>
      <line x1="413.3" y1="0" x2="413.3" y2="250"/>
      <line x1="516.7" y1="0" x2="516.7" y2="250"/>
    </g>
    <g stroke="#808080" stroke-width="1.4">
      <line x1="0" y1="208" x2="620" y2="208"/>
      <line x1="310" y1="0" x2="310" y2="250"/>
    </g>
    <path d="M 0 208 C 102 208 154 208 206 209 C 242 211 262 224 286 226 C 309 228 326 212 348 192 C 380 162 410 122 454 92 C 500 60 552 25 620 0" fill="none" stroke="#9333ea" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0 208 L 310 208 L 620 0" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 8" opacity="0.45"/>
    <g font-family="Arial, sans-serif" font-size="12" fill="#555555">
      <text x="0" y="274" text-anchor="middle">-3</text>
      <text x="103.3" y="274" text-anchor="middle">-2</text>
      <text x="206.7" y="274" text-anchor="middle">-1</text>
      <text x="310" y="274" text-anchor="middle">0</text>
      <text x="413.3" y="274" text-anchor="middle">1</text>
      <text x="516.7" y="274" text-anchor="middle">2</text>
      <text x="620" y="274" text-anchor="middle">3</text>
      <text x="-12" y="212" text-anchor="end">0</text>
      <text x="-12" y="129" text-anchor="end">1</text>
      <text x="-12" y="46" text-anchor="end">2</text>
      <text x="620" y="228" text-anchor="end" fill="#9333ea" font-weight="700">smooth gate near zero</text>
    </g>
  </g>
</svg>
